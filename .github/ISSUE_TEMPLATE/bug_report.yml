name: Relatar falha
description: Registre um comportamento reproduzível.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: impact
    attributes:
      label: Impacto
      description: Quem é afetado e o que deixa de funcionar?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Informe passos mínimos e resultado observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Segurança
      options:
        - label: Removi credenciais, dados pessoais e informações sensíveis.
          required: true
